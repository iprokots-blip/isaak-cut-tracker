name: Wire Work Addon

on:
  push:
    branches: [main]
    paths:
      - 'work-wire-trigger.txt'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  wire-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wire work module and bump cache
        shell: bash
        run: |
          if ! grep -q 'work-addon.js' app.js; then
            printf '\nsetTimeout(()=>{const s=document.createElement("script");s.src="./work-addon.js?v=1";document.body.appendChild(s)},0);\n' >> app.js
          fi
          sed -i 's/app\.js?v=6/app.js?v=7/g; s/app\.js?v=5/app.js?v=7/g' index.html
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Wire work shift tracking into app' || true
          git push || true
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
