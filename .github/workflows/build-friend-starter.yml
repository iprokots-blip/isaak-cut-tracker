name: Build isolated Lyse friend starter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-friend-starter.yml'
      - 'friend-starter-trigger.txt'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Lyse source
        uses: actions/checkout@v4

      - name: Build isolated starter
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, secrets, shutil

          root=Path('dist/Lyse_Friend_Starter')
          root.mkdir(parents=True,exist_ok=True)
          for f in ['index.html','app.js','goal-colors.js','target-editor.js','work-addon.js','manifest.webmanifest']:
              shutil.copy2(f,root/f)

          # Remove every connection to the original Supabase project/session.
          p=root/'app.js'
          s=p.read_text()
          s=re.sub(r'^const BASE=.*?;$','const BASE="__SUPABASE_URL__";',s,count=1,flags=re.M)
          s=re.sub(r'^const KEY=.*?;$','const KEY="__SUPABASE_PUBLISHABLE_KEY__";',s,count=1,flags=re.M)
          s=re.sub(r'^const SESSION_KEY=.*?;$','const SESSION_KEY="lyse_session_REPLACE_WITH_UNIQUE_VALUE_v1";',s,count=1,flags=re.M)

          # Independent installs use a local clean seed; no original app_seed dependency.
          start=s.find('async function seed(){')
          end=s.find('function mergeSeed',start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate seed() in app.js')
          local_seed='async function seed(){let r=await fetch("./starter-state.json",{cache:"no-store"});if(!r.ok)throw new Error("Starter state could not be loaded.");return await r.json()}\n'
          s=s[:start]+local_seed+s[end:]
          p.write_text(s)

          # Generic, non-personal clean initial state. Friend personalises on setup.
          starter={
            'foods':[
              {'id':'starter_chicken','name':'Chicken breast, cooked','serving':'100 g','calories':165,'protein':31,'carbs':0,'fat':3.6,'category':'Meat / Poultry','source':'Starter'},
              {'id':'starter_rice','name':'White rice, cooked','serving':'100 g','calories':130,'protein':2.7,'carbs':28.2,'fat':0.3,'category':'Grains / Bread','source':'Starter'},
              {'id':'starter_egg','name':'Egg','serving':'1 large egg (~50 g)','calories':72,'protein':6.3,'carbs':0.4,'fat':4.8,'category':'Eggs','source':'Starter'},
              {'id':'starter_banana','name':'Banana','serving':'1 medium (~120 g)','calories':105,'protein':1.3,'carbs':27,'fat':0.3,'category':'Fruit','source':'Starter'},
              {'id':'starter_apple','name':'Apple','serving':'1 medium (~180 g)','calories':95,'protein':0.5,'carbs':25,'fat':0.3,'category':'Fruit','source':'Starter'},
              {'id':'starter_oats','name':'Rolled oats, dry','serving':'40 g','calories':152,'protein':5.1,'carbs':24.4,'fat':3.6,'category':'Grains / Bread','source':'Starter'},
              {'id':'starter_yoghurt','name':'Greek yoghurt, natural','serving':'100 g','calories':115,'protein':3.3,'carbs':3.8,'fat':9.5,'category':'Dairy','source':'Starter'},
              {'id':'starter_milk','name':'Full cream milk','serving':'250 mL','calories':160,'protein':8.3,'carbs':12,'fat':8.8,'category':'Dairy','source':'Starter'},
              {'id':'starter_bread','name':'Bread','serving':'1 slice (~35 g)','calories':90,'protein':3.2,'carbs':16.5,'fat':1.2,'category':'Grains / Bread','source':'Starter'},
              {'id':'starter_avocado','name':'Avocado','serving':'100 g','calories':160,'protein':2,'carbs':8.5,'fat':14.7,'category':'Fruit','source':'Starter'},
              {'id':'starter_tuna','name':'Tuna in springwater, drained','serving':'100 g','calories':116,'protein':26,'carbs':0,'fat':1,'category':'Seafood','source':'Starter'},
              {'id':'starter_potato','name':'Potato, cooked','serving':'100 g','calories':87,'protein':1.9,'carbs':20.1,'fat':0.1,'category':'Vegetable','source':'Starter'},
              {'id':'starter_broccoli','name':'Broccoli, cooked','serving':'100 g','calories':35,'protein':2.4,'carbs':7.2,'fat':0.4,'category':'Vegetable','source':'Starter'},
              {'id':'starter_peas','name':'Green peas, cooked','serving':'100 g','calories':84,'protein':5.4,'carbs':15.6,'fat':0.2,'category':'Vegetable','source':'Starter'},
              {'id':'starter_lentils','name':'Lentils, cooked','serving':'100 g','calories':116,'protein':9,'carbs':20,'fat':0.4,'category':'Legume','source':'Starter'},
              {'id':'starter_pasta','name':'Pasta, cooked','serving':'100 g','calories':158,'protein':5.8,'carbs':30.9,'fat':0.9,'category':'Grains / Bread','source':'Starter'},
              {'id':'starter_oliveoil','name':'Olive oil','serving':'1 tsp (5 mL)','calories':40,'protein':0,'carbs':0,'fat':4.5,'category':'Fats / Oils','source':'Starter'},
              {'id':'starter_beef','name':'Lean beef, cooked','serving':'100 g','calories':200,'protein':27,'carbs':0,'fat':10,'category':'Meat / Poultry','source':'Starter'},
              {'id':'starter_salmon','name':'Salmon, cooked','serving':'100 g','calories':206,'protein':22,'carbs':0,'fat':12,'category':'Seafood','source':'Starter'},
              {'id':'starter_tofu','name':'Firm tofu','serving':'100 g','calories':144,'protein':17,'carbs':2.8,'fat':8.7,'category':'Plant-based','source':'Starter'}
            ],
            'logs':[], 'weights':{}, 'activities':{}, 'favourites':[],
            'selectedDate':'',
            'settings':{
              'startDate':'2026-01-01','startWeight':80,'maintenanceAtStart':2600,
              'age':25,'heightCm':175,'bodyFat':0.22,'sex':'Male','activity':'Moderate',
              'goalWeight':70,'goalDate':'2026-12-31','goalBodyFat':0.15,'goalBF':0.15,
              'strideM':0.78,'workoutMET':5,'manualMaintenance':None,'walkingKcalPerKgKm':0.5,
              'targetMode':'auto','useBodyFatGoal':False
            }
          }
          (root/'starter-state.json').write_text(json.dumps(starter,separators=(',',':')))

          # Database schema. Only each authenticated user can access their own state.
          sql='''-- Run in the FRIEND'S OWN Supabase project only.\ncreate table if not exists public.app_state (\n  user_id uuid primary key references auth.users(id) on delete cascade,\n  state jsonb not null default '{}'::jsonb,\n  updated_at timestamptz not null default now()\n);\n\nalter table public.app_state enable row level security;\n\ndrop policy if exists "app_state_select_own" on public.app_state;\ncreate policy "app_state_select_own" on public.app_state for select to authenticated using (auth.uid() = user_id);\n\ndrop policy if exists "app_state_insert_own" on public.app_state;\ncreate policy "app_state_insert_own" on public.app_state for insert to authenticated with check (auth.uid() = user_id);\n\ndrop policy if exists "app_state_update_own" on public.app_state;\ncreate policy "app_state_update_own" on public.app_state for update to authenticated using (auth.uid() = user_id) with check (auth.uid() = user_id);\n\ndrop policy if exists "app_state_delete_own" on public.app_state;\ncreate policy "app_state_delete_own" on public.app_state for delete to authenticated using (auth.uid() = user_id);\n'''
          (root/'supabase_setup.sql').write_text(sql)

          # Clean Pages deployment workflow for the friend's repo.
          wf=root/'.github/workflows'
          wf.mkdir(parents=True,exist_ok=True)
          (wf/'pages.yml').write_text('''name: Deploy Lyse to GitHub Pages\non:\n  push:\n    branches: [main]\n  workflow_dispatch:\npermissions:\n  contents: read\n  pages: write\n  id-token: write\nconcurrency:\n  group: pages\n  cancel-in-progress: true\njobs:\n  deploy:\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/configure-pages@v5\n      - uses: actions/upload-pages-artifact@v3\n        with:\n          path: .\n      - id: deployment\n        uses: actions/deploy-pages@v4\n''')

          prompt='''I have uploaded a clean starter ZIP for an app called Lyse. Set it up as a completely independent installation owned only by me.\n\nIMPORTANT ISOLATION RULES:\n- Do not connect to, edit, fork into, deploy from, or use credentials from the original owner's GitHub or Supabase.\n- Use only GitHub and Supabase accounts that I connect in this chat.\n- Create a new GitHub repository under my account.\n- Create a new Supabase project under my account.\n- Run supabase_setup.sql only in my Supabase project.\n- Replace __SUPABASE_URL__ in app.js with my project's URL.\n- Replace __SUPABASE_PUBLISHABLE_KEY__ with my project's publishable/anon key. Never put a service-role key in frontend code.\n- Replace lyse_session_REPLACE_WITH_UNIQUE_VALUE_v1 with a random unique session key for my installation.\n- Do not copy any original user ID, email, password, tracking history, custom foods, weights, logs or settings.\n\nSETUP:\n1. Ask me for my age, sex, height, current/start weight, rough body-fat %, goal weight or target BF%, goal date, timezone, and preferred starting maintenance if I know it.\n2. Update the clean starter settings to my details.\n3. Preserve all supplied Lyse features: food logging, custom foods, synced cloud state, weight progress, calories/macros, automatic/manual targets, body-fat goal estimator, coloured target cards, workouts, steps, work shifts and goal forecasts.\n4. Expand the starter food library to about 1,000 useful foods, prioritising Australian foods and FSANZ/AFCD-style entries where practical. Do not copy the original owner's personal/custom foods unless I explicitly provide them.\n5. Keep authentication email/password based. Help me create my own account/password through my own Supabase Auth.\n6. After my account works, offer to disable public sign-ups so this installation is private to me.\n7. Deploy with GitHub Pages using the included .github/workflows/pages.yml.\n8. Give me my final Pages URL and iPhone instructions: Safari -> Share -> Add to Home Screen.\n9. Test that there are no references to the original owner's Supabase URL, publishable key, GitHub repo, user ID, email, password, data or session key before finishing.\n\nDo the setup with me using connected tools where available rather than only explaining generic steps.\n'''
          (root/'PROMPT_FOR_FRIENDS_CHATGPT.txt').write_text(prompt)

          readme='''# Lyse Friend Starter — isolated copy\n\nThis package is intentionally disconnected from the original Lyse installation. It contains no original Supabase URL/key, no original user ID, no original email/password, no personal tracking history, and no workflow capable of writing to the original GitHub repository.\n\n## Files\n- `index.html`, `app.js`, `goal-colors.js`, `target-editor.js`, `work-addon.js`: Lyse frontend\n- `starter-state.json`: clean non-personal bootstrap state with a small generic food list\n- `supabase_setup.sql`: creates the friend's own `app_state` table and RLS\n- `.github/workflows/pages.yml`: independent GitHub Pages deployment\n- `PROMPT_FOR_FRIENDS_CHATGPT.txt`: paste into the friend's ChatGPT together with this ZIP\n\n## Before it can connect\n`app.js` contains deliberate placeholders: `__SUPABASE_URL__`, `__SUPABASE_PUBLISHABLE_KEY__`, and `lyse_session_REPLACE_WITH_UNIQUE_VALUE_v1`. A separate installation must replace these using the friend's own Supabase project.\n\n## Isolation guarantee by design\nOnce the friend uses a different GitHub repository and a different Supabase project, the two installations have no shared database, authentication users, deployment pipeline, state row or credentials. Changes to one cannot propagate to the other unless somebody deliberately reconnects one app to the other's Supabase project or grants cross-account repository access.\n'''
          (root/'README_FIRST.md').write_text(readme)

          # Extra check: the package must not contain known original identifiers.
          banned=['jlmqnvyznyaoapjkyjmj','iprokots@gmail.com','3eced74a-22c9-4692-836b-ae20f714e520','isaak_cut_tracker_session_v2','iprokots-blip/isaak-cut-tracker']
          for file in root.rglob('*'):
              if file.is_file():
                  text=file.read_text(errors='ignore')
                  hits=[x for x in banned if x in text]
                  if hits:
                      raise SystemExit(f'Isolation check failed in {file}: {hits}')
          print('Isolation check passed')
          PY

      - name: Create ZIP
        run: |
          cd dist
          zip -qr Lyse_Friend_Starter.zip Lyse_Friend_Starter

      - name: Upload isolated starter ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Lyse_Friend_Starter
          path: dist/Lyse_Friend_Starter.zip
          if-no-files-found: error
