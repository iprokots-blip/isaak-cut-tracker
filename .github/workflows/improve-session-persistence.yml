name: Improve Lyse session persistence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/improve-session-persistence.yml'
      - 'session-persistence-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make sessions durable and silently refreshed
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('app.js')
          s=p.read_text()

          old='async function refreshSession(){try{let d=await jsonFetch("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:session.refresh_token})},false,false);storeSession(d);return true}catch{storeSession(null);return false}}'
          new='''let sessionRefreshTimer=null,refreshPromise=null;\nfunction sessionExpiresSoon(bufferSec=1800){const exp=+session?.expires_at||0;return !exp||exp*1000-Date.now()<bufferSec*1000}\nasync function refreshSession(){\n if(refreshPromise)return refreshPromise;\n if(!session?.refresh_token)return false;\n refreshPromise=(async()=>{try{const previous=session;let d=await jsonFetch("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:previous.refresh_token})},false,false);if(!d?.access_token)throw new Error("No refreshed access token returned");storeSession({...previous,...d,user:d.user||previous.user});return true}catch(e){console.warn("Session refresh deferred; keeping saved login",e);return false}finally{refreshPromise=null}})();\n return refreshPromise;\n}\nfunction startSessionKeepAlive(){clearInterval(sessionRefreshTimer);sessionRefreshTimer=setInterval(()=>{if(session?.refresh_token&&sessionExpiresSoon(1800))refreshSession()},15*60*1000)}'''
          if old not in s:
              raise SystemExit('Expected refreshSession code not found; refusing unsafe patch')
          s=s.replace(old,new)

          old_boot='async function boot(){try{let raw=localStorage.getItem(SESSION_KEY);if(raw){session=JSON.parse(raw);let u=await getUser();if(u){await loadCloud();return}}}catch(e){console.error(e)}status("Sign in")}'
          new_boot='''async function boot(){try{let raw=localStorage.getItem(SESSION_KEY);if(raw){session=JSON.parse(raw);if(session?.refresh_token)await refreshSession();let u=await getUser();if(u){startSessionKeepAlive();await loadCloud();return}if(session?.refresh_token&&await refreshSession()){u=await getUser();if(u){startSessionKeepAlive();await loadCloud();return}}}}catch(e){console.error(e)}status("Sign in")}'''
          if old_boot not in s:
              raise SystemExit('Expected boot code not found; refusing unsafe patch')
          s=s.replace(old_boot,new_boot)

          old_load='status("Live","live");startPolling()}'
          new_load='status("Live","live");startSessionKeepAlive();startPolling()}'
          if old_load in s:
              s=s.replace(old_load,new_load,1)

          old_signout='clearInterval(pollTimer);storeSession(null);state=null;'
          new_signout='clearInterval(pollTimer);clearInterval(sessionRefreshTimer);storeSession(null);state=null;'
          if old_signout in s:
              s=s.replace(old_signout,new_signout,1)

          old_focus='window.addEventListener("focus",()=>{if(user)pullCloud()});'
          new_focus='''window.addEventListener("focus",async()=>{if(session?.refresh_token&&sessionExpiresSoon(3600))await refreshSession();if(user)pullCloud()});\ndocument.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&session?.refresh_token&&sessionExpiresSoon(3600))refreshSession()});\nwindow.addEventListener("online",async()=>{if(session?.refresh_token){const ok=await refreshSession();if(ok&&!user)boot()}});'''
          if old_focus not in s:
              raise SystemExit('Expected focus handler not found; refusing unsafe patch')
          s=s.replace(old_focus,new_focus)

          p.write_text(s)

          ip=Path('index.html')
          html=ip.read_text()
          html=re.sub(r'app\\.js\\?v=\\d+', 'app.js?v=12', html)
          ip.write_text(html)
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git diff --cached --quiet || git commit -m 'Keep Lyse signed in with silent session refresh'
          git push
