name: Wire Lyse library additions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-library-additions.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add library additions script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./library-additions.js?v=1"></script>'
          if tag not in s:
              s=s.replace('<script src="./target-editor.js?v=1"></script>', tag+'\n<script src="./target-editor.js?v=1"></script>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Wire personal food library additions into Lyse'
          git push
