name: Add chicken mince and cooked pasta

on:
  push:
    branches: [main]
    paths:
      - 'chicken-mince-pasta-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add foods to core personal library
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          p=Path('app.js')
          s=p.read_text()
          items=[
            ('f_20260827_chicken_mince_cooked_100g','{id:"f_20260827_chicken_mince_cooked_100g",name:"Chicken Mince — Cooked (100 g)",serving:"100 g",calories:170,protein:25,carbs:0,fat:7.5,category:"Custom",source:"Generic lean cooked chicken mince estimate"}'),
            ('f_20260827_pasta_cooked_100g','{id:"f_20260827_pasta_cooked_100g",name:"Pasta — Cooked (100 g)",serving:"100 g",calories:158,protein:5.8,carbs:30.9,fat:0.9,category:"Custom",source:"Generic cooked pasta estimate"}')
          ]
          m=re.search(r'const PERSONAL_FOODS=\[(.*?)\];',s,re.S)
          if not m:
              raise SystemExit('PERSONAL_FOODS not found')
          inner=m.group(1).strip()
          for food_id,obj in items:
              if food_id not in s:
                  inner=(inner+',' if inner else '')+obj
          s=s[:m.start()]+'const PERSONAL_FOODS=['+inner+'];'+s[m.end():]
          p.write_text(s)

          i=Path('index.html')
          x=i.read_text()
          x=re.sub(r'<script src="\./app\.js\?v=\d+"></script>','<script src="./app.js?v=17"></script>',x)
          i.write_text(x)

          mf=Path('manifest.webmanifest')
          data=json.loads(mf.read_text())
          data['start_url']='./?v=lyse-chicken-mince-pasta-20260827'
          mf.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html manifest.webmanifest
          git diff --cached --quiet || git commit -m 'Add chicken mince and cooked pasta 100g foods to Lyse'
          git push
