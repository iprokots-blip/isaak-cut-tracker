name: Add Cheeky Chicken salad roll

on:
  push:
    branches: [main]
    paths:
      - 'cheeky-chicken-roll-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add food to core personal library
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          p=Path('app.js')
          s=p.read_text()
          food_id='f_20260828_cheeky_chicken_salad_roll_bbq'
          obj='{id:"'+food_id+'",name:"Cheeky Chicken — Chicken Salad Roll with BBQ Sauce",serving:"1 whole roll",calories:680,protein:45,carbs:88,fat:16,category:"Custom",source:"Estimated from Cheeky Chicken menu ingredients — chicken breast, lettuce, tomato, carrot, long roll and BBQ sauce"}'
          if food_id not in s:
              m=re.search(r'const PERSONAL_FOODS=\[(.*?)\];',s,re.S)
              if not m:
                  raise SystemExit('PERSONAL_FOODS not found')
              inner=m.group(1).strip()
              replacement='const PERSONAL_FOODS=['+(inner+',' if inner else '')+obj+'];'
              s=s[:m.start()]+replacement+s[m.end():]
              p.write_text(s)

          i=Path('index.html')
          x=i.read_text()
          x=re.sub(r'<script src="\./app\.js\?v=\d+"></script>','<script src="./app.js?v=18"></script>',x)
          i.write_text(x)

          mf=Path('manifest.webmanifest')
          data=json.loads(mf.read_text())
          data['start_url']='./?v=lyse-cheeky-chicken-roll-20260828'
          mf.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html manifest.webmanifest
          git diff --cached --quiet || git commit -m 'Add Cheeky Chicken BBQ salad roll to Lyse library'
          git push
