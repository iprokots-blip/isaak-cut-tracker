name: Add GYG and OAK foods

on:
  push:
    branches: [main]
    paths:
      - 'gyg-oak-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add foods to core personal library
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          p=Path('app.js')
          s=p.read_text()
          items=[
            ('f_20260828_gyg_regular_bowl_grilled_chicken','{id:"f_20260828_gyg_regular_bowl_grilled_chicken",name:"Guzman y Gomez — Regular Grilled Chicken Bowl (Mild)",serving:"1 regular bowl (455 g)",calories:668,protein:41.9,carbs:73.7,fat:22.5,category:"Custom",source:"GYG official nutrition guide — Mild Grilled Chicken Bowl"}'),
            ('f_20260828_oak_plus_protein_vanilla_500ml','{id:"f_20260828_oak_plus_protein_vanilla_500ml",name:"OAK Plus Protein Vanilla — 500 mL",serving:"1 bottle (500 mL)",calories:292,protein:30,carbs:26.5,fat:7,category:"Custom",source:"Current Woolworths/Coles branded nutrition listing — 1220 kJ per 500 mL"}')
          ]
          m=re.search(r'const PERSONAL_FOODS=\[(.*?)\];',s,re.S)
          if not m:
              raise SystemExit('PERSONAL_FOODS not found')
          inner=m.group(1).strip()
          for food_id,obj in items:
              if food_id not in s:
                  inner=(inner+',' if inner else '')+obj
          replacement='const PERSONAL_FOODS=['+inner+'];'
          s=s[:m.start()]+replacement+s[m.end():]
          p.write_text(s)

          i=Path('index.html')
          x=i.read_text()
          x=re.sub(r'<script src="\./app\.js\?v=\d+"></script>','<script src="./app.js?v=20"></script>',x)
          i.write_text(x)

          mf=Path('manifest.webmanifest')
          data=json.loads(mf.read_text())
          data['start_url']='./?v=lyse-gyg-oak-20260828'
          mf.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html manifest.webmanifest
          git diff --cached --quiet || git commit -m 'Add GYG grilled chicken bowl and OAK vanilla to Lyse library'
          git push
