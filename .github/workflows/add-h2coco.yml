name: Clean accidental H2Coco entry

on:
  push:
    branches: [main]
    paths:
      - 'h2coco-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove accidental H2Coco food from core and synced state
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          p=Path('app.js')
          s=p.read_text()
          food_id='f_20260829_h2coco_pure_coconut_water_1l'

          # Remove the accidental H2Coco object from PERSONAL_FOODS.
          s=re.sub(r',?\{id:"f_20260829_h2coco_pure_coconut_water_1l"[^}]*\}', '', s, count=1)

          # Add a removal set so an already-synced copy is filtered from state on load.
          if 'const REMOVED_PERSONAL_FOOD_IDS=' not in s:
              marker='let session=null,user=null,state=null,timer=null,saving=false,pollTimer=null;'
              s=s.replace(marker, 'const REMOVED_PERSONAL_FOOD_IDS=new Set(["'+food_id+'"]);\n'+marker, 1)
          elif food_id not in re.search(r'const REMOVED_PERSONAL_FOOD_IDS=.*?;',s).group(0):
              s=s.replace('const REMOVED_PERSONAL_FOOD_IDS=new Set([', 'const REMOVED_PERSONAL_FOOD_IDS=new Set(["'+food_id+'",', 1)

          old='function mergeSeed(s,base){let current=[...(s.foods||[])],have=new Set(current.map(f=>f.name));let foods=[...current,...(base.foods||[]).filter(f=>!have.has(f.name))];for(const item of PERSONAL_FOODS){if(!foods.some(f=>f.id===item.id||String(f.name||"").toLowerCase()===item.name.toLowerCase()))foods.unshift({...item})}return {...base,...s,foods}}'
          new='function mergeSeed(s,base){let current=[...(s.foods||[])].filter(f=>!REMOVED_PERSONAL_FOOD_IDS.has(f.id)),have=new Set(current.map(f=>f.name));let foods=[...current,...(base.foods||[]).filter(f=>!REMOVED_PERSONAL_FOOD_IDS.has(f.id)&&!have.has(f.name))];for(const item of PERSONAL_FOODS){if(!foods.some(f=>f.id===item.id||String(f.name||"").toLowerCase()===item.name.toLowerCase()))foods.unshift({...item})}return {...base,...s,foods}}'
          if old in s:
              s=s.replace(old,new,1)

          old2='let needsPersonalSave=false;if(rows?.[0]?.state){needsPersonalSave=PERSONAL_FOODS.some(item=>!hasPersonalFood(rows[0].state,item));state=mergeSeed(rows[0].state,base)}'
          new2='let needsPersonalSave=false;if(rows?.[0]?.state){needsPersonalSave=PERSONAL_FOODS.some(item=>!hasPersonalFood(rows[0].state,item))||(rows[0].state.foods||[]).some(f=>REMOVED_PERSONAL_FOOD_IDS.has(f.id));state=mergeSeed(rows[0].state,base)}'
          if old2 in s:
              s=s.replace(old2,new2,1)

          p.write_text(s)

          i=Path('index.html')
          x=i.read_text()
          x=re.sub(r'<script src="\./app\.js\?v=\d+"></script>','<script src="./app.js?v=21"></script>',x)
          i.write_text(x)

          mf=Path('manifest.webmanifest')
          data=json.loads(mf.read_text())
          data['start_url']='./?v=lyse-cocobella-clean-20260829'
          mf.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html manifest.webmanifest
          git diff --cached --quiet || git commit -m 'Keep Cocobella and remove accidental H2Coco entry'
          git push
