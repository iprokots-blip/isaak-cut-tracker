name: Add H2Coco coconut water

on:
  push:
    branches: [main]
    paths:
      - 'h2coco-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add food to core personal library
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          p=Path('app.js')
          s=p.read_text()
          food_id='f_20260829_h2coco_pure_coconut_water_1l'
          obj='{id:"'+food_id+'",name:"H2Coco Pure Coconut Water — 1 L",serving:"1 bottle (1 L)",calories:213,protein:2,carbs:46,fat:0,category:"Custom",source:"H2Coco 1 L nutrition"}'
          if food_id not in s:
              m=re.search(r'const PERSONAL_FOODS=\[(.*?)\];',s,re.S)
              if not m:
                  raise SystemExit('PERSONAL_FOODS not found')
              inner=m.group(1).strip()
              replacement='const PERSONAL_FOODS=['+(inner+',' if inner else '')+obj+'];'
              s=s[:m.start()]+replacement+s[m.end():]
              p.write_text(s)

          i=Path('index.html')
          x=i.read_text()
          x=re.sub(r'<script src="\./app\.js\?v=\d+"></script>','<script src="./app.js?v=20"></script>',x)
          i.write_text(x)

          mf=Path('manifest.webmanifest')
          data=json.loads(mf.read_text())
          data['start_url']='./?v=lyse-h2coco-20260829'
          mf.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html manifest.webmanifest
          git diff --cached --quiet || git commit -m 'Add H2Coco coconut water to Lyse library'
          git push
