name: Apply Lyse branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-apoptos.yml'
      - 'manifest.webmanifest'

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rename visible app branding
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('Apoptos', 'Lyse')
          s = s.replace('./app.js?v=8', './app.js?v=9')
          p.write_text(s)

          p = Path('manifest.webmanifest')
          s = p.read_text().replace('Apoptos', 'Lyse')
          p.write_text(s)
          PY
      - name: Commit branding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest
          git diff --cached --quiet || git commit -m 'Rename visible app branding to Lyse'
          git push
