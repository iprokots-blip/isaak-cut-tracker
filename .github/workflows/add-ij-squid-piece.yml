name: Add I&J squid piece

on:
  push:
    branches: [main]
    paths:
      - 'ij-squid-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add food to core personal library
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          p=Path('app.js')
          s=p.read_text()
          food_id='f_20260828_ij_salt_pepper_squid_piece_19g'
          obj='{id:"'+food_id+'",name:"I&J Salt & Pepper Squid — 1 Piece (~19 g)",serving:"1 piece (~19 g)",calories:29,protein:2.0,carbs:2.6,fat:1.1,category:"Custom",source:"I&J retail nutrition per 100 g; per-piece weight estimated from current I&J foodservice spec (~4 pieces per 76 g)"}'
          if food_id not in s:
              m=re.search(r'const PERSONAL_FOODS=\[(.*?)\];',s,re.S)
              if not m:
                  raise SystemExit('PERSONAL_FOODS not found')
              inner=m.group(1).strip()
              replacement='const PERSONAL_FOODS=['+(inner+',' if inner else '')+obj+'];'
              s=s[:m.start()]+replacement+s[m.end():]
              p.write_text(s)

          i=Path('index.html')
          x=i.read_text()
          x=re.sub(r'<script src="\./app\.js\?v=\d+"></script>','<script src="./app.js?v=19"></script>',x)
          i.write_text(x)

          mf=Path('manifest.webmanifest')
          data=json.loads(mf.read_text())
          data['start_url']='./?v=lyse-ij-squid-20260828'
          mf.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html manifest.webmanifest
          git diff --cached --quiet || git commit -m 'Add I&J salt and pepper squid per-piece food to Lyse library'
          git push
