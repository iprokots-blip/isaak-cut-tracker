name: Fix mobile Lyse goal colours

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-goal-colours.yml'
      - 'mobile-colours-trigger.txt'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Inline goal colours and bust iOS caches
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<link rel="manifest" href="./manifest.webmanifest">','<link rel="manifest" href="./manifest.webmanifest?v=mobile-colours-3">')
          s=s.replace('<script src="./app.js?v=9"></script>','<script src="./app.js?v=10"></script>')
          s=s.replace('<script src="./target-editor.js?v=1"></script>','<script src="./target-editor.js?v=2"></script>')

          old='<script src="./goal-colors.js?v=2"></script>'
          inline='''<script>
/* Inline goal colours so installed iPhone PWAs cannot retain a stale external colour script. */
(function(){
 const css=`#kpis .kpi{transition:background-color .25s ease,border-color .25s ease,box-shadow .25s ease}#kpis .kpi.goal-under{background:#fffbeb!important;border-color:#fde7a7!important}#kpis .kpi.goal-on{background:#f3fbf5!important;border-color:#ccebd3!important}#kpis .kpi.goal-over{background:#fff5f5!important;border-color:#f2cece!important}#kpis .goal-state{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:10px;font-weight:800;letter-spacing:.02em}#kpis .goal-state:before{content:'';width:6px;height:6px;border-radius:50%;display:inline-block;background:currentColor;opacity:.7}#kpis .goal-under .goal-state{color:#a16207}#kpis .goal-on .goal-state{color:#268344}#kpis .goal-over .goal-state{color:#b83a3a}`;
 const st=document.createElement('style');st.id='lyse-inline-goal-colours-v3';st.textContent=css;document.head.appendChild(st);
 function classify(name,current,target){const r=(+current||0)/(+target||1);let lo=.90,hi=1.05;if(name==='Calories'){lo=.95;hi=1.02}else if(name==='Protein'){lo=.90;hi=1.10}return r<lo?['goal-under','Under']:r<=hi?['goal-on','On target']:['goal-over','Over']}
 function apply(){try{if(typeof state==='undefined'||!state||typeof target!=='function'||typeof totals!=='function')return;const d=state.selectedDate||(typeof melToday==='function'?melToday():new Date().toISOString().slice(0,10)),t=target(),x=totals(d),vals={Calories:[x.k,t.cal],Protein:[x.p,t.pro],Carbs:[x.c,t.carb],Fat:[x.f,t.fat]};document.querySelectorAll('#kpis .kpi').forEach(card=>{const name=(card.querySelector('span')?.textContent||'').trim(),v=vals[name];card.classList.remove('goal-under','goal-on','goal-over');card.querySelector('.goal-state')?.remove();if(!v)return;const c=classify(name,v[0],v[1]);card.classList.add(c[0]);const e=document.createElement('div');e.className='goal-state';e.textContent=c[1];card.appendChild(e)})}catch(e){console.error('Lyse inline goal colours failed',e)}}
 function hook(){if(typeof renderToday!=='function')return false;if(window.__lyseInlineGoalColoursV3)return true;window.__lyseInlineGoalColoursV3=true;const base=renderToday;renderToday=function(){const r=base.apply(this,arguments);apply();return r};apply();return true}
 if(!hook()){let n=0,t=setInterval(()=>{if(hook()||++n>120)clearInterval(t)},100)}
})();
</script>'''
          if old in s:
              s=s.replace(old,inline)
          elif 'lyse-inline-goal-colours-v3' not in s:
              s=s.replace('</body>',inline+'\n</body>')
          p.write_text(s)

          m=Path('manifest.webmanifest')
          data=json.loads(m.read_text())
          data['start_url']='./?v=lyse-mobile-colours-20260819-2105'
          m.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest
          git diff --cached --quiet || git commit -m 'Fix goal colours in installed iPhone app'
          git push
