name: Wire Lyse target editor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-target-editor.yml'
      - 'target-editor.js'

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add target editor to app shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./target-editor.js?v=1"></script>'
          if tag not in s:
              marker='<script src="./goal-colors.js?v=2"></script>'
              s=s.replace(marker,tag+'\n'+marker)
          p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Enable editable nutrition and BF targets'
          git push
